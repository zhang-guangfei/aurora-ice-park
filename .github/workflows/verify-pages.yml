name: Verify live game

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-pages.yml'
      - '.github/tests/pages.cjs'
  workflow_run:
    workflows: ['pages build and deployment']
    branches: [gh-pages]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install browser test tools
        run: npm install --prefix "$RUNNER_TEMP/park-check" --no-audit --no-fund --ignore-scripts --no-package-lock playwright-core@1.58.2 pngjs@7.0.0
      - name: Check the published game in Chrome
        env:
          RELEASE_REF: ${{ github.event.workflow_run.head_sha || 'origin/gh-pages' }}
        run: NODE_PATH="$RUNNER_TEMP/park-check/node_modules" node .github/tests/pages.cjs
